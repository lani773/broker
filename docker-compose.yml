version: "3.9"

# LUMA MQTT Broker v2 – Full Go Stack
# Single binary serves: MQTT :1883, MQTT TLS :8883, REST+WS API :8080, Metrics :9090

networks:
  luma:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  prom-data:
  grafana-data:

x-broker-env: &broker-env
  LOG_LEVEL:          info
  LOG_FORMAT:         json
  MQTT_TCP_ADDR:      ":1883"
  MQTT_TLS_ADDR:      ":8883"
  API_ADDR:           ":8080"
  METRICS_ADDR:       ":9090"
  METRICS_ENABLED:    "true"
  MAX_CONNECTIONS:    "50000"
  WRITE_QUEUE_SIZE:   "512"
  MAX_PACKET_SIZE:    "10485760"
  SYS_INTERVAL:       "10s"
  REDIS_ADDR:         "redis:6379"
  REDIS_POOL_SIZE:    "50"
  REDIS_MIN_IDLE:     "10"
  POSTGRES_DSN:       "postgres://mqtt:${POSTGRES_PASSWORD:-mqtt_secret}@postgres:5432/mqtt?sslmode=disable"
  PG_MAX_CONNS:       "25"
  PG_MIN_CONNS:       "5"
  JWT_SECRET:         "${JWT_SECRET:-luma-dev-secret-change-in-production}"
  JWT_DURATION:       "24h"
  JWT_ISSUER:         "luma-broker"
  BCRYPT_COST:        "12"
  RATE_LIMIT:         "1000"
  RATE_BURST:         "2000"
  ADMIN_PASSWORD:     "${ADMIN_PASSWORD:-admin123}"
  CLUSTER_MODE:       "false"

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: luma-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     mqtt
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mqtt_secret}"
      POSTGRES_DB:       mqtt
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - luma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqtt -d mqtt"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: luma-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --hz 20
      --tcp-backlog 65535
    volumes:
      - redis-data:/data
    networks:
      - luma
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ─── Broker (single Go binary) ───────────────────────────────────────────────

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luma-broker
    restart: unless-stopped
    environment:
      <<: *broker-env
    ports:
      - "1883:1883"   # MQTT plain
      - "8883:8883"   # MQTT TLS
      - "8080:8080"   # REST + WebSocket API
      - "9090:9090"   # Prometheus metrics
    networks:
      - luma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 256M

  # ─── Cluster Mode (scale out) ────────────────────────────────────────────────
  # Uncomment to run a second broker instance sharing state via Redis.
  # broker-2:
  #   build: { context: ., dockerfile: Dockerfile }
  #   environment:
  #     <<: *broker-env
  #     MQTT_TCP_ADDR: ":1884"
  #     API_ADDR:      ":8081"
  #     METRICS_ADDR:  ":9091"
  #     CLUSTER_MODE:  "true"
  #   ports: ["1884:1884","8081:8081"]
  #   depends_on: [postgres, redis]
  #   networks: [luma]

  # ─── Monitoring ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: luma-prom
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - luma

  grafana:
    image: grafana/grafana:latest
    container_name: luma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - luma
